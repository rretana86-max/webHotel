#name: WebHotel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore WebHotelvesion1.0/WebHotelvesion1.0.csproj
    - name: Build
      run: dotnet build WebHotelvesion1.0/WebHotelvesion1.0.csproj --no-restore
     
